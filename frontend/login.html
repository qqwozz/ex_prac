<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubium — Вход</title>
    <link rel="icon" type="image/png" href="data/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <style>
        :root {
            --bg: #0F0F1A;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --brand: #A78BFA;
            --brand-glow: rgba(167,139,250,0.15);
            --accent: #F472B6;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --radius: 24px;
            --radius-sm: 16px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            position:relative;overflow:hidden;-webkit-font-smoothing:antialiased
        }
        body::before{
            content:'';position:fixed;top:-300px;left:-300px;width:800px;height:800px;
            background:radial-gradient(circle,rgba(167,139,250,0.06),transparent 70%);
            pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;bottom:-250px;right:-250px;width:700px;height:700px;
            background:radial-gradient(circle,rgba(244,114,182,0.05),transparent 70%);
            pointer-events:none;z-index:0;
        }

        .auth-box{
            background:var(--glass);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
            padding:44px 36px;border-radius:var(--radius);width:90%;max-width:400px;
            border:1px solid var(--glass-border);position:relative;z-index:1;animation:fadeInUp 0.5s ease
        }
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

        .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;text-decoration:none}
        .logo-text{font-family:'Unbounded',sans-serif;font-size:1.4rem;font-weight:800;color:var(--text);letter-spacing:-1px}
        .logo-text span{background:linear-gradient(135deg,var(--brand),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .subtitle{text-align:center;color:var(--text-secondary);margin-bottom:32px;font-size:0.88rem;font-weight:500}

        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:8px;font-weight:700;color:var(--text-muted);font-size:0.7rem;text-transform:uppercase;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace}
        .form-group input{
            width:100%;padding:13px 16px;border:2px solid var(--glass-border);border-radius:var(--radius-sm);
            font-family:inherit;font-size:0.92rem;background:rgba(255,255,255,0.03);color:var(--text);
            transition:all 0.3s ease;letter-spacing:-0.2px
        }
        .form-group input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-glow);background:rgba(255,255,255,0.05)}
        .form-group input::placeholder{color:var(--text-muted)}

        .btn{width:100%;padding:14px;border:none;border-radius:50px;font-family:inherit;font-size:0.92rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;letter-spacing:-0.3px}
        .btn-primary{background:linear-gradient(135deg,var(--brand),#8B5CF6);color:#fff;margin:6px 0 18px;box-shadow:0 6px 18px var(--brand-glow)}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(167,139,250,0.3);background:linear-gradient(135deg,#8B5CF6,#7C3AED)}

        .error{background:rgba(248,113,113,0.04);color:#F87171;padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:18px;display:none;font-size:0.8rem;border:1.5px solid rgba(248,113,113,0.12);font-weight:500;text-align:center}

        .link{text-align:center;margin-top:18px;font-size:0.85rem;color:var(--text-secondary)}
        .link a{color:var(--brand);text-decoration:none;font-weight:600}
        .link a:hover{text-decoration:underline}

        .back-link{text-align:center;margin-top:16px;font-size:0.8rem}
        .back-link a{color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:color 0.3s}
        .back-link a:hover{color:var(--brand)}
    </style>
</head>
<body>
    <div class="auth-box">
        <a href="index.html" class="logo">
            <div class="logo-text"><span>Rub</span>ium</div>
        </a>
        <p class="subtitle">Войди и продолжай подготовку</p>

        <div class="error" id="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="max@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" placeholder="Ваш пароль" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <div class="link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></div>
        <div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> На главную</a></div>
    </div>

    <script>
        const errorEl = document.getElementById('error');

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            setTimeout(() => errorEl.style.display = 'none', 5000);
        }

        // Выход перед логином
        (async function() {
            await supabase.auth.signOut();
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Заполните email и пароль');
                return;
            }

            // 1. Вход через Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({ 
                email, 
                password 
            });

            if (error) {
                if (error.message.includes('Invalid login credentials')) {
                    showError('Неверный email или пароль');
                } else {
                    showError(error.message);
                }
                return;
            }

            if (!data.user) {
                showError('Ошибка входа');
                return;
            }

            // 2. Проверяем, есть ли пользователь в rubium_users
            const { data: rubiumUser, error: rubiumError } = await supabase
                .from('rubium_users')
                .select('*')
                .eq('auth_id', data.user.id)
                .maybeSingle();

            // Если нет — создаём
            if (rubiumError || !rubiumUser) {
                const name = data.user.user_metadata?.first_name || data.user.email?.split('@')[0] || 'ученик';
                const { error: insertError } = await supabase
                    .from('rubium_users')
                    .upsert({
                        auth_id: data.user.id,
                        email: data.user.email,
                        first_name: name,
                        last_name: data.user.user_metadata?.last_name || '',
                        status: 'user',
                        xp: 0,
                        level: 1,
                        streak: 0,
                        tasks_solved: 0,
                        tasks_correct: 0,
                        accuracy: 0,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'auth_id' });

                if (insertError) {
                    console.error('❌ Ошибка создания rubium_user:', insertError);
                    showError('Ошибка при входе');
                    await supabase.auth.signOut();
                    return;
                }
            }

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
