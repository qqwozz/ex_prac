<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubium — Тренажёр</title>
    <link rel="icon" type="image/png" href="data/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Unbounded:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0F0F1A;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.06);
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --brand: #A78BFA;
            --brand-glow: rgba(167,139,250,0.15);
            --accent: #F472B6;
            --success: #34D399;
            --danger: #F87171;
            --warning: #FBBF24;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --radius: 24px;
            --radius-sm: 16px;
            --sidebar-width: 240px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);
            min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
            display:flex;overflow-x:hidden;
        }
        body::before{
            content:'';position:fixed;top:-300px;left:-300px;width:800px;height:800px;
            background:radial-gradient(circle,rgba(167,139,250,0.06),transparent 70%);
            pointer-events:none;z-index:0;
        }
        body::after{
            content:'';position:fixed;bottom:-250px;right:-250px;width:700px;height:700px;
            background:radial-gradient(circle,rgba(244,114,182,0.05),transparent 70%);
            pointer-events:none;z-index:0;
        }

        .sidebar{
            position:fixed;left:0;top:0;bottom:0;z-index:100;
            width:var(--sidebar-width);background:rgba(255,255,255,0.02);
            border-right:1px solid var(--glass-border);
            backdrop-filter:blur(20px);
            display:flex;flex-direction:column;
            padding:20px 16px;
            transition:transform 0.3s ease;
        }
        .sidebar-brand{
            font-family:'Unbounded',sans-serif;font-size:1.3rem;font-weight:800;
            padding:8px 12px 20px;letter-spacing:-1px;color:var(--text);
            display:flex;align-items:center;gap:10px;
        }
        .sidebar-brand span{background:linear-gradient(135deg,var(--brand),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        .sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:4px 0;overflow-y:auto}
        .sidebar-nav::-webkit-scrollbar{width:3px}
        .sidebar-nav::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:10px}

        .nav-link{
            display:flex;align-items:center;gap:14px;
            padding:10px 14px;border-radius:var(--radius-sm);
            color:var(--text-secondary);text-decoration:none;
            font-size:0.85rem;font-weight:600;
            transition:all 0.2s;letter-spacing:-0.2px;
        }
        .nav-link i{width:20px;font-size:1rem;text-align:center;flex-shrink:0}
        .nav-link:hover{background:var(--surface-hover);color:var(--text)}
        .nav-link.active{background:var(--brand-glow);color:var(--brand);box-shadow:0 0 20px var(--brand-glow)}
        .nav-link.admin-link{
            border-left:2px solid var(--warning);
            margin-top:8px;
            padding-top:12px;
            border-top:1px solid var(--glass-border);
        }

        .sidebar-footer{
            border-top:1px solid var(--glass-border);padding-top:16px;margin-top:8px;
        }
        .sidebar-footer a{
            text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px;
            padding:6px 8px;border-radius:var(--radius-sm);transition:background 0.2s;
        }
        .sidebar-footer a:hover{background:var(--surface-hover)}
        .user-avatar{
            width:36px;height:36px;border-radius:50%;
            background:linear-gradient(135deg,var(--brand),var(--accent));
            display:flex;align-items:center;justify-content:center;
            font-weight:700;font-size:0.85rem;color:#fff;flex-shrink:0;
        }
        .sidebar-user-info{flex:1;min-width:0}
        .sidebar-user-name{font-size:0.8rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .sidebar-user-email{font-size:0.65rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .logout-btn{
            background:none;border:none;color:var(--text-muted);
            cursor:pointer;padding:6px 8px;border-radius:8px;
            transition:all 0.2s;font-size:0.9rem;margin-left:auto;
        }
        .logout-btn:hover{background:rgba(248,113,113,0.1);color:var(--danger)}

        .main-content{
            margin-left:var(--sidebar-width);flex:1;min-height:100vh;min-height:100dvh;
            display:flex;flex-direction:column;position:relative;z-index:1;
        }

        .topbar{
            display:flex;align-items:center;justify-content:space-between;
            padding:16px 32px;flex-shrink:0;
            border-bottom:1px solid var(--glass-border);
        }
        .topbar-left{display:flex;align-items:center;gap:16px}
        .hamburger{
            display:none;background:none;border:none;color:var(--text);
            font-size:1.3rem;cursor:pointer;padding:6px;
        }
        .page-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}

        .content{
            flex:1;padding:24px 32px 32px;
            max-width:1100px;margin:0 auto;width:100%;
        }

        .screen{display:none;animation:fadeUp 0.3s ease}
        .screen.active{display:block}
        @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

        .subjects-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;
            margin-top:12px;
        }
        .subject-card{
            background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius-sm);padding:24px 16px;text-align:center;
            cursor:pointer;transition:all 0.3s;
        }
        .subject-card:hover{background:var(--surface-hover);border-color:var(--brand);transform:translateY(-2px)}
        .subject-card .icon{font-size:2rem;color:var(--brand);display:block;margin-bottom:8px}
        .subject-card .name{font-size:1rem;font-weight:700}
        .subject-card .count{font-size:0.7rem;color:var(--text-muted);margin-top:4px}

        .filters-row{
            display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;
            padding:16px 20px;background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius-sm);align-items:center;
        }
        .filter-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .filter-label{font-size:0.6rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-family:'JetBrains Mono',monospace}
        .filter-btn{
            padding:4px 14px;border:1px solid var(--glass-border);border-radius:14px;
            background:transparent;color:var(--text-secondary);font-size:0.7rem;
            font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit;
        }
        .filter-btn:hover{background:var(--surface-hover);color:var(--text)}
        .filter-btn.active{background:var(--brand-glow);border-color:var(--brand);color:var(--brand)}

        .numbers-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:10px;
            margin-top:12px;
        }
        .num-btn{
            padding:12px 0;background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius-sm);color:var(--text-secondary);
            font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s;
            font-family:'JetBrains Mono',monospace;
            position:relative;
        }
        .num-btn:hover{background:var(--surface-hover);border-color:var(--brand);color:var(--text)}
        .num-btn.selected{background:var(--brand-glow);border-color:var(--brand);color:var(--brand)}
        .num-btn .check{
            position:absolute;top:-6px;right:-6px;font-size:0.6rem;
            color:var(--success);display:none;
        }
        .num-btn.selected .check{display:block}

        .variant-controls{
            display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;
            padding:16px 0;border-top:1px solid var(--glass-border);
            align-items:center;
        }
        .variant-controls .count{font-size:0.85rem;color:var(--text-secondary)}
        .btn-primary{
            padding:10px 28px;background:var(--brand);border:none;border-radius:var(--radius-sm);
            color:#0F0F1A;font-weight:700;font-size:0.85rem;cursor:pointer;
            transition:all 0.3s;font-family:inherit;
        }
        .btn-primary:hover{background:#8B5CF6;transform:translateY(-1px)}
        .btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
        .btn-secondary{
            padding:8px 18px;background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius-sm);color:var(--text-secondary);
            font-weight:600;font-size:0.8rem;cursor:pointer;transition:all 0.2s;
            font-family:inherit;
        }
        .btn-secondary:hover{background:var(--surface-hover);color:var(--text)}
        .btn-back{
            background:none;border:none;color:var(--text-muted);
            cursor:pointer;font-size:0.75rem;font-family:'JetBrains Mono',monospace;
            padding:8px 0;
        }
        .btn-back:hover{color:var(--text)}

        .task-card{
            background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius);padding:24px;margin-bottom:16px;
        }
        .task-meta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
        .tag{
            font-size:0.65rem;font-weight:700;padding:4px 12px;border-radius:14px;
            font-family:'JetBrains Mono',monospace;
        }
        .tag-subject{background:rgba(167,139,250,0.1);color:var(--brand)}
        .tag-topic{background:rgba(244,114,182,0.1);color:var(--accent)}
        .tag-level{background:rgba(251,191,36,0.1);color:var(--warning)}
        .tag-exam{background:rgba(52,211,153,0.1);color:var(--success)}
        .tag-number{background:rgba(148,163,184,0.08);color:var(--text-secondary)}

        .task-content{font-size:0.95rem;line-height:1.7;color:var(--text-secondary);margin-bottom:16px}
        .task-content .katex-display{margin:8px 0}

        .answer-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
        .answer-input{
            flex:1;min-width:200px;padding:10px 14px;font-size:0.95rem;
            font-family:'JetBrains Mono',monospace;font-weight:600;
            background:rgba(255,255,255,0.03);border:2px solid var(--glass-border);
            border-radius:var(--radius-sm);color:var(--text);outline:none;
        }
        .answer-input:focus{border-color:var(--brand)}
        .answer-input:disabled{opacity:0.4;cursor:not-allowed}

        .btn-check{
            padding:10px 22px;background:var(--brand);border:none;border-radius:var(--radius-sm);
            color:#0F0F1A;font-weight:700;font-size:0.85rem;cursor:pointer;
            transition:all 0.3s;font-family:inherit;
        }
        .btn-check:hover:not(:disabled){background:#8B5CF6;transform:translateY(-1px)}
        .btn-check:disabled{opacity:0.4;cursor:not-allowed}

        .result-block{
            margin-top:12px;padding:12px 16px;border-radius:var(--radius-sm);
            animation:fadeUp 0.3s ease;
        }
        .result-block.correct{background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.15)}
        .result-block.incorrect{background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.15)}
        .result-title{font-weight:700;margin-bottom:4px}
        .result-text{font-size:0.85rem;color:var(--text-secondary);line-height:1.6}

        .task-nav{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
        .btn-nav{
            padding:8px 18px;background:var(--glass);border:1px solid var(--glass-border);
            border-radius:var(--radius-sm);color:var(--text-secondary);
            font-weight:600;font-size:0.8rem;cursor:pointer;transition:all 0.2s;
            font-family:inherit;
        }
        .btn-nav:hover:not(:disabled){background:var(--surface-hover);color:var(--text)}
        .btn-nav:disabled{opacity:0.3;cursor:not-allowed}

        .variant-progress{
            font-size:0.75rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;
            padding:8px 0;margin-bottom:12px;border-bottom:1px solid var(--glass-border);
        }

        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
        .overlay.show{display:block}

        @media (max-width: 768px) {
            .sidebar{transform:translateX(-100%);width:280px}
            .sidebar.open{transform:translateX(0)}
            .main-content{margin-left:0}
            .hamburger{display:block}
            .topbar{padding:12px 16px}
            .content{padding:16px}
            .subjects-grid{grid-template-columns:1fr 1fr}
            .filters-row{flex-direction:column;align-items:flex-start}
        }
        @media (max-width: 480px) {
            .subjects-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span>Rub</span>ium</div>
    <nav class="sidebar-nav">
        <a href="index.html" class="nav-link"><i class="fas fa-house"></i> Главная</a>
        <a href="trainer.html" class="nav-link active"><i class="fas fa-pencil"></i> Тренажёр</a>
        <a href="daily.html" class="nav-link"><i class="fas fa-calendar-day"></i> Ежедневные</a>
        <a href="exam.html" class="nav-link"><i class="fas fa-file-pen"></i> Варианты</a>
        <a href="stats.html" class="nav-link"><i class="fas fa-chart-line"></i> Статистика</a>
        <a href="notebook.html" class="nav-link"><i class="fas fa-book"></i> Тетради</a>
        <a href="admin.html" class="nav-link admin-link" id="adminLink" style="display:none">
            <i class="fas fa-shield-halved"></i> Админ-панель
        </a>
        <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Профиль</a>
    </nav>
    <div class="sidebar-footer">
        <a href="profile.html">
            <div class="user-avatar" id="sidebarAvatar">И</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" id="sidebarName">...</div>
                <div class="sidebar-user-email" id="sidebarEmail">...</div>
            </div>
            <button class="logout-btn" onclick="event.stopPropagation();logout()" title="Выйти">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </a>
    </div>
</aside>

<div class="main-content">
    <header class="topbar">
        <div class="topbar-left">
            <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <span class="page-title">Тренажёр</span>
        </div>
    </header>

    <div class="content">
        <!-- ЭКРАН 1: ПРЕДМЕТЫ -->
        <div class="screen active" id="screenSubjects">
            <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:4px">Выбери предмет</h2>
            <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:16px">Доступные предметы</p>
            <div class="subjects-grid" id="subjectsGrid"></div>
        </div>

        <!-- ЭКРАН 2: ФИЛЬТРЫ + НОМЕРА -->
        <div class="screen" id="screenNumbers">
            <button class="btn-back" onclick="goToSubjects()"><i class="fas fa-arrow-left"></i> Назад</button>
            <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:4px" id="numbersTitle">Задания</h2>
            
            <div class="filters-row" id="filtersRow">
                <div class="filter-group">
                    <span class="filter-label">Уровень:</span>
                    <button class="filter-btn active" data-level="all" onclick="toggleFilter('level','all')">Все</button>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Экзамен:</span>
                    <button class="filter-btn active" data-exam="all" onclick="toggleFilter('exam','all')">Все</button>
                </div>
            </div>

            <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:4px" id="numbersSub">Выбери номера для варианта</p>
            <div class="numbers-grid" id="numbersGrid"></div>
            <div class="variant-controls">
                <span class="count" id="selectedCount">Выбрано: 0</span>
                <button class="btn-secondary" onclick="selectAllNumbers()">Выбрать все</button>
                <button class="btn-secondary" onclick="clearSelectedNumbers()">Очистить</button>
                <button class="btn-primary" id="startVariantBtn" onclick="startVariant()" disabled>
                    <i class="fas fa-play"></i> Составить вариант
                </button>
            </div>
        </div>

        <!-- ЭКРАН 3: ВАРИАНТ -->
        <div class="screen" id="screenVariant">
            <button class="btn-back" onclick="goToNumbers()"><i class="fas fa-arrow-left"></i> Назад</button>
            <h2 style="font-size:1.3rem;font-weight:800;margin-bottom:4px">Вариант</h2>
            <div class="variant-progress" id="variantProgress">Задача 1 из 3</div>
            <div id="variantContainer"></div>
            <div class="task-nav">
                <button class="btn-nav" id="variantPrev" onclick="variantNavigate(-1)"><i class="fas fa-chevron-left"></i> Предыдущая</button>
                <button class="btn-nav" id="variantNext" onclick="variantNavigate(1)">Следующая <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:5080';
    let allTasks = [];
    let currentSubject = null;
    let availableLevels = [];
    let availableExams = [];
    let selectedLevel = 'all';
    let selectedExam = 'all';
    let availableNumbers = [];
    let selectedNumbers = [];
    let variantTasks = [];
    let variantIndex = 0;
    let variantAnswered = {};

    const SUBJECT_NAMES = {
        math: 'Математика',
        russian: 'Русский язык',
        physics: 'Физика',
        chemistry: 'Химия',
        biology: 'Биология',
        history: 'История',
        social_studies: 'Обществознание',
        english: 'Английский язык',
        literature: 'Литература',
        informatics: 'Информатика'
    };
    const SUBJECT_ICONS = {
        math: 'fa-calculator',
        russian: 'fa-language',
        physics: 'fa-atom',
        chemistry: 'fa-flask',
        biology: 'fa-dna',
        history: 'fa-landmark',
        social_studies: 'fa-scale-balanced',
        english: 'fa-language',
        literature: 'fa-book-open',
        informatics: 'fa-laptop-code'
    };

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function goToSubjects() { showScreen('screenSubjects'); }
    function goToNumbers() { showScreen('screenNumbers'); }

    async function logout() {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    }

    // ===== ЗАГРУЗКА ПРЕДМЕТОВ =====
    async function loadSubjects() {
        try {
            console.log('1. Загружаем задачи...');
            const res = await fetch(`${API}/api/v1/tasks?limit=2000`);
            console.log('2. Ответ получен, статус:', res.status);
            
            const text = await res.text();
            console.log('Ответ как текст:', text.substring(0, 200));
            const data = JSON.parse(text);
            console.log('3. Данные получены, tasks:', data.tasks ? data.tasks.length : 0);
            
            allTasks = data.tasks || [];
            console.log('4. allTasks:', allTasks.length);

            const subjects = [...new Set(allTasks.map(t => t.subject).filter(Boolean))];
            console.log('5. subjects:', subjects);
            
            const grid = document.getElementById('subjectsGrid');
            if (subjects.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:40px 0">Нет заданий</p>`;
                return;
            }

            grid.innerHTML = subjects.map(subj => {
                const count = allTasks.filter(t => t.subject === subj).length;
                return `
                    <div class="subject-card" onclick="selectSubject('${subj}')">
                        <span class="icon"><i class="fas ${SUBJECT_ICONS[subj] || 'fa-book'}"></i></span>
                        <div class="name">${SUBJECT_NAMES[subj] || subj}</div>
                        <div class="count">${count} заданий</div>
                    </div>
                `;
            }).join('');

            console.log('6. Готово!');

        } catch (e) {
            console.error('Ошибка загрузки предметов:', e);
            document.getElementById('subjectsGrid').innerHTML = `<p style="color:var(--danger)">Ошибка загрузки: ${e.message}</p>`;
        }
    }

    // ===== ВЫБОР ПРЕДМЕТА =====
    async function selectSubject(subject) {
        currentSubject = subject;
        await loadFilters(subject);
        showScreen('screenNumbers');
    }

    // ===== ЗАГРУЗКА ФИЛЬТРОВ =====
    async function loadFilters(subject) {
        try {
            const tasks = allTasks.filter(t => t.subject === subject);
            
            const levels = [...new Set(tasks.map(t => t.level).filter(Boolean))];
            const exams = [...new Set(tasks.map(t => t.exam_type).filter(Boolean))];
            
            availableLevels = levels;
            availableExams = exams;
            selectedLevel = 'all';
            selectedExam = 'all';

            const filtersRow = document.getElementById('filtersRow');
            let html = `
                <div class="filter-group">
                    <span class="filter-label">Уровень:</span>
                    <button class="filter-btn active" data-level="all" onclick="toggleFilter('level','all')">Все</button>
            `;
            levels.forEach(l => {
                html += `<button class="filter-btn" data-level="${l}" onclick="toggleFilter('level','${l}')">${l}</button>`;
            });
            html += `</div><div class="filter-group"><span class="filter-label">Экзамен:</span>
                    <button class="filter-btn active" data-exam="all" onclick="toggleFilter('exam','all')">Все</button>`;
            exams.forEach(e => {
                html += `<button class="filter-btn" data-exam="${e}" onclick="toggleFilter('exam','${e}')">${e}</button>`;
            });
            html += `</div>`;
            filtersRow.innerHTML = html;

            document.getElementById('numbersTitle').textContent = `${SUBJECT_NAMES[subject] || subject}`;
            await loadNumbers();

        } catch (e) {
            console.error('Ошибка загрузки фильтров:', e);
        }
    }

    // ===== ПЕРЕКЛЮЧЕНИЕ ФИЛЬТРА =====
    function toggleFilter(type, value) {
        const btns = document.querySelectorAll(`.filter-btn[data-${type}]`);
        btns.forEach(b => b.classList.remove('active'));
        
        if (value === 'all') {
            const btn = document.querySelector(`.filter-btn[data-${type}="all"]`);
            if (btn) btn.classList.add('active');
            if (type === 'level') selectedLevel = 'all';
            else selectedExam = 'all';
        } else {
            const btn = document.querySelector(`.filter-btn[data-${type}="${value}"]`);
            if (btn) btn.classList.add('active');
            if (type === 'level') selectedLevel = value;
            else selectedExam = value;
        }
        
        loadNumbers();
    }

    // ===== ЗАГРУЗКА НОМЕРОВ =====
    async function loadNumbers() {
        try {
            let tasks = allTasks.filter(t => t.subject === currentSubject);
            
            if (selectedLevel !== 'all') {
                tasks = tasks.filter(t => t.level === selectedLevel);
            }
            if (selectedExam !== 'all') {
                tasks = tasks.filter(t => t.exam_type === selectedExam);
            }

            const numbers = [...new Set(tasks.map(t => t.task_number).filter(n => n !== null))].sort((a,b) => a-b);
            availableNumbers = numbers;
            selectedNumbers = [];

            document.getElementById('numbersSub').textContent = `${numbers.length} заданий`;

            const grid = document.getElementById('numbersGrid');
            if (numbers.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:20px 0">Нет заданий с номерами</p>`;
            } else {
                grid.innerHTML = numbers.map(num => `
                    <button class="num-btn" data-num="${num}" onclick="toggleNumber(${num})">
                        ${num}
                        <span class="check"><i class="fas fa-check-circle"></i></span>
                    </button>
                `).join('');
            }

            updateSelectedCount();

        } catch (e) {
            console.error('Ошибка загрузки номеров:', e);
            document.getElementById('numbersGrid').innerHTML = `<p style="color:var(--danger)">Ошибка загрузки</p>`;
        }
    }

    // ===== ВЫБОР НОМЕРОВ =====
    function toggleNumber(num) {
        const idx = selectedNumbers.indexOf(num);
        if (idx === -1) {
            selectedNumbers.push(num);
        } else {
            selectedNumbers.splice(idx, 1);
        }
        updateNumbersUI();
    }

    function selectAllNumbers() {
        selectedNumbers = [...availableNumbers];
        updateNumbersUI();
    }

    function clearSelectedNumbers() {
        selectedNumbers = [];
        updateNumbersUI();
    }

    function updateNumbersUI() {
        document.querySelectorAll('.num-btn').forEach(btn => {
            const num = parseInt(btn.dataset.num);
            btn.classList.toggle('selected', selectedNumbers.includes(num));
        });
        updateSelectedCount();
    }

    function updateSelectedCount() {
        document.getElementById('selectedCount').textContent = `Выбрано: ${selectedNumbers.length}`;
        document.getElementById('startVariantBtn').disabled = selectedNumbers.length === 0;
    }

    // ===== СТАРТ ВАРИАНТА =====
    async function startVariant() {
        if (selectedNumbers.length === 0) return;

        let tasks = allTasks.filter(t => t.subject === currentSubject);
        if (selectedLevel !== 'all') tasks = tasks.filter(t => t.level === selectedLevel);
        if (selectedExam !== 'all') tasks = tasks.filter(t => t.exam_type === selectedExam);

        variantTasks = tasks.filter(t => selectedNumbers.includes(t.task_number));
        variantIndex = 0;
        variantAnswered = {};

        showScreen('screenVariant');
        renderVariant();
    }

    // ===== РЕНДЕРИНГ ВАРИАНТА =====
    function renderVariant() {
        const container = document.getElementById('variantContainer');
        const task = variantTasks[variantIndex];

        if (!task) {
            container.innerHTML = '<p style="color:var(--text-secondary)">Нет задач</p>';
            return;
        }

        document.getElementById('variantProgress').textContent = `Задача ${variantIndex + 1} из ${variantTasks.length}`;

        const isAnswered = variantAnswered[task.id] !== undefined;
        const result = variantAnswered[task.id] || null;

        container.innerHTML = `
            <div class="task-card">
                <div class="task-meta">
                    <span class="tag tag-subject">${SUBJECT_NAMES[task.subject] || task.subject}</span>
                    <span class="tag tag-topic">${task.topic || 'Без темы'}</span>
                    <span class="tag tag-level">${task.level || 'общее'}</span>
                    <span class="tag tag-exam">${task.exam_type || 'общее'}</span>
                    <span class="tag tag-number">№${task.task_number}</span>
                </div>
                <div class="task-content" id="variantContent"></div>
                <div class="answer-row">
                    <input type="text" class="answer-input" id="variantAnswer" placeholder="Твой ответ" ${isAnswered ? 'disabled' : ''}>
                    <button class="btn-check" id="variantCheckBtn" onclick="checkVariantAnswer()" ${isAnswered ? 'disabled' : ''}>
                        <i class="fas fa-check"></i> Проверить
                    </button>
                </div>
                <div id="variantResult"></div>
            </div>
        `;

        let content = task.content || '';
        content = content.replace(/\$\$(.*?)\$\$/g, (_, formula) => {
            try { return katex.renderToString(formula, { displayMode: true }); } 
            catch (e) { return `<code>${formula}</code>`; }
        });
        content = content.replace(/\$(.*?)\$/g, (_, formula) => {
            try { return katex.renderToString(formula, { displayMode: false }); } 
            catch (e) { return `<code>${formula}</code>`; }
        });
        document.getElementById('variantContent').innerHTML = marked.parse(content);

        if (typeof renderMathInElement === 'function') {
            try {
                renderMathInElement(document.getElementById('variantContent'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            } catch(e) {}
        }

        if (isAnswered) {
            const resultEl = document.getElementById('variantResult');
            if (result) {
                if (result.correct) {
                    resultEl.innerHTML = `
                        <div class="result-block correct">
                            <div class="result-title" style="color:var(--success)"><i class="fas fa-check-circle"></i> Правильно!</div>
                        </div>
                    `;
                } else {
                    resultEl.innerHTML = `
                        <div class="result-block incorrect">
                            <div class="result-title" style="color:var(--danger)"><i class="fas fa-times-circle"></i> Неправильно</div>
                            <div class="result-text">Правильный ответ: <strong>${result.correct_answer}</strong></div>
                        </div>
                    `;
                }
            }
        }

        document.getElementById('variantPrev').disabled = variantIndex === 0;
        document.getElementById('variantNext').disabled = variantIndex === variantTasks.length - 1;

        if (!isAnswered) {
            setTimeout(() => document.getElementById('variantAnswer')?.focus(), 100);
        }
    }

    // ===== ПРОВЕРКА ОТВЕТА =====
    async function checkVariantAnswer() {
        const task = variantTasks[variantIndex];
        if (!task) return;
        if (variantAnswered[task.id] !== undefined) return;

        const input = document.getElementById('variantAnswer');
        const answer = input.value.trim();
        if (!answer) return;

        input.disabled = true;
        const btn = document.getElementById('variantCheckBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const res = await fetch(`${API}/api/v1/check`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: task.id, answer })
            });
            const data = await res.json();

            variantAnswered[task.id] = data;
            renderVariant();

        } catch (e) {
            console.error('Ошибка проверки:', e);
            input.disabled = false;
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> Проверить';
        }
    }

    // ===== НАВИГАЦИЯ =====
    function variantNavigate(delta) {
        const newIndex = variantIndex + delta;
        if (newIndex < 0 || newIndex >= variantTasks.length) return;
        variantIndex = newIndex;
        renderVariant();
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && document.getElementById('screenVariant').classList.contains('active')) {
            const task = variantTasks[variantIndex];
            if (task && variantAnswered[task.id] === undefined) {
                checkVariantAnswer();
            }
        }
    });

    // ===== INIT =====
    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = 'login.html'; return; }

        const { data: ru } = await supabase
            .from('rubium_users')
            .select('*')
            .eq('auth_id', user.id)
            .maybeSingle();

        if (ru) {
            const name = ru.first_name || ru.email?.split('@')[0] || 'ученик';
            document.getElementById('sidebarName').textContent = name;
            document.getElementById('sidebarEmail').textContent = ru.email || '';
            document.getElementById('sidebarAvatar').textContent = (name[0] || 'У').toUpperCase();
            if (ru.status === 'admin') {
                document.getElementById('adminLink').style.display = 'flex';
            }
        }

        await loadSubjects();
    }

    init();
</script>
</body>
